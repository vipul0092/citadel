[tools]
go = "1.25.0"
"golangci-lint" = "2"
"github:knope-dev/knope" = "knope/v0.22.4"

[tasks.build]
description = "Build the citadel binary"
run = 'go build -o citadel ./cmd/citadel'

[tasks.test]
description = "Run all tests"
run = "go test ./... -count=1 -timeout 30s"

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.test-integration]
description = "Run integration tests (spawns real subprocesses; run 'mise run build' first)"
run = "go test -tags integration -count=1 -timeout 120s ./internal/control/..."

[tasks.clean]
description = "Remove build artifacts"
run = "rm -f citadel"

[tasks.release]
description = "Bump version, update changelog, commit and tag locally"
run = "knope release"

[tasks."release:dry-run"]
description = "Preview what the next release would do"
run = "knope release --dry-run"

[tasks.changeset]
description = "Document a change (creates a changeset file)"
run = "knope document-change"
