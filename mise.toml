[tools]
go = "1.25.0"
"golangci-lint" = "2"
"github:knope-dev/knope" = "knope/v0.22.4"

[tasks.build]
description = "Build the citadel binary"
run = 'go build -o citadel ./cmd/citadel'

[tasks.test]
description = "Run all tests"
run = "go test ./... -count=1 -timeout 30s"

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.clean]
description = "Remove build artifacts"
run = "rm -f citadel citadel-linux citadel-windows.exe"

[tasks.release]
description = "Bump version, update changelog, commit and tag locally"
run = "knope release"

[tasks."release:dry-run"]
description = "Preview what the next release would do"
run = "knope release --dry-run"

[tasks.changeset]
description = "Document a change (creates a changeset file)"
run = "knope document-change"

[tasks."build:linux"]
description = "Cross-compile for Linux amd64"
run = 'GOOS=linux GOARCH=amd64 go build -o citadel-linux ./cmd/citadel'

[tasks."build:windows"]
description = "Cross-compile for Windows amd64"
run = 'GOOS=windows GOARCH=amd64 go build -o citadel-windows.exe ./cmd/citadel'
